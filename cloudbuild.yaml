# Substituições dinâmicas para tornar o build mais reutilizável
substitutions:
  _SERVICE_NAME: cl-biometrics
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _DEPLOY_REGION: us-central1

steps:
  # 1. Fazer build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    args:
      [
        'build',
        '--no-cache', # Adicionado para garantir um build "limpo"
        '-t',
        '$_AR_HOSTNAME/$PROJECT_ID/meu-repo/$_SERVICE_NAME:$SHORT_SHA',
        '.' # Diretório do Dockerfile
      ]

  # 2. Enviar a imagem para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      [
        'push',
        '$_AR_HOSTNAME/$PROJECT_ID/meu-repo/$_SERVICE_NAME:$SHORT_SHA'
      ]

  # 3. Fazer o deploy no Cloud Run com a tag 'test' e sem passar tráfego
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: Deploy
    entrypoint: 'gcloud'
    args:
      [
        'run',
        'deploy',
        '$_SERVICE_NAME',
        '--image',
        '$_AR_HOSTNAME/$PROJECT_ID/meu-repo/$_SERVICE_NAME:$SHORT_SHA',
        '--region',
        '$_DEPLOY_REGION',
        '--platform',
        'managed',
        '--no-traffic',  # Não direcionar tráfego automaticamente
        '--tag=test',    # Tag para identificar como revisão de teste
        '--allow-unauthenticated',
        '--memory=2Gi',  # Configurar 2 GB de memória
        '--cpu=2',       # Configurar 2 CPUs
        # Laboratório de Modelos (ver docs/laboratorio-de-modelos.md): conta de serviço que só lê e cria no bucket,
        # o bucket do registro e o commit de cada ajuste. Por enquanto sem o login Google (ALLOMETRY_WRITE=open: quem
        # grava escreve o nome); para religar, trocar --clear-secrets por
        # --update-secrets=/secrets/streamlit/secrets.toml=cl-biometrics-streamlit-secrets:latest e tirar o open
        '--service-account=cl-biometrics-run@$PROJECT_ID.iam.gserviceaccount.com',
        '--clear-secrets',
        '--update-env-vars=ALLOMETRY_STORE=gs://$PROJECT_ID-allometry,ALLOMETRY_WRITE=open,GIT_COMMIT=$SHORT_SHA',
        '--session-affinity',  # o login do Streamlit fica na memória da instância que o iniciou
        '--timeout=3600'       # a conexão da página (websocket) não cai durante um ajuste longo
      ]

# Registrar a imagem gerada no Artifact Registry
images:
  - '$_AR_HOSTNAME/$PROJECT_ID/meu-repo/$_SERVICE_NAME:$SHORT_SHA'

# Configurações adicionais para logging e substituições flexíveis
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

# Adicionando tags para rastreamento e categorização do build
tags:
  - gcp-cloud-build-deploy-cloud-run
  - $_SERVICE_NAME
