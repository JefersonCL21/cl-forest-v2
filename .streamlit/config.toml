[theme]
primaryColor="#363636"
backgroundColor="#FFFAFA"
secondaryBackgroundColor= "#D3D3D3"
textColor="#35401E"

[server]
headless = true
address = "0.0.0.0"
port = 8080
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[secrets]
# On Cloud Run the secret cl-biometrics-streamlit-secrets is mounted at /secrets/streamlit (a file mounted
# into .streamlit/ would hide this config); locally, .streamlit/secrets.toml. A missing file is skipped.
files = ["/secrets/streamlit/secrets.toml", ".streamlit/secrets.toml"]
